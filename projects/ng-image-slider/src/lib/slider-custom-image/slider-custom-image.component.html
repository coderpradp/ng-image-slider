@if (type() === INVALID) {
  <div [dir]="direction()" class="invalid-msg">Invalid file format</div>
} @else if (fileUrl() || videoSrc()) {
  <div
    class="custom-image-main"
    [ngClass]="{ 'ng-fullimage-loading': imageLoading() }"
  >
    @switch (type()) {
      @case (IMAGE) {
        <img
          class="image"
          (load)="imageLoading.set(false)"
          [ngClass]="{ ratio: ratio() }"
          [src]="fileUrl()"
          [attr.alt]="alt() ? alt() : null"
          [attr.title]="title() ? title() : null"
          [attr.loading]="lazy() === true ? 'lazy' : null"
          (error)="errorHandler($event)"
        />
      }
      @case (YOUTUBE) {
        <iframe
          class="youtube"
          [src]="fileUrl()"
          [attr.loading]="lazy() === true ? 'lazy' : null"
          frameborder="0"
          allow="autoplay"
          allowfullscreen
        ></iframe>
      }
      @case (VIDEO) {
        <video
          class="video"
          #videoEl
          [id]="'video_' + imageIndex()"
          [ngClass]="{ ratio: ratio() }"
          (click)="videoClickHandler($event)"
          [autoplay]="videoAutoPlay()"
          type="video/mp4"
          [attr.controls]="showVideoControls() ? showVideoControls() : null"
          controlsList="nodownload"
        >
          <source [src]="videoSrc()" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      }
    }
    @if (type() === YOUTUBE || type() === VIDEO || isVideo()) {
      <span class="youtube-icon"></span>
    }
  </div>
}
